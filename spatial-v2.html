<!doctype html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1511" />
  <meta name="description" content="Prostorni WebAR kronovizor krapinskog neandertalca." />
  <title>Krapinski neandertalac · Prostorni kronovizor</title>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="./spatial.css?v=2" />

<body>
  <canvas id="camerafeed"></canvas>
  <div id="hud">

      <a id="backLink" class="back" href="./" aria-label="Povratak na glavni kronovizor">← Kronovizor</a>
      <div id="spatialTitle" class="pill">KRAPINA · PROSTORNI KRONOVIZOR</div>

      <div id="status">Uspostavljam prostorni prikaz…</div>
    </div>
    <div class="actions">
      <button id="recenter" type="button">Ponovno usidri</button>
      <button id="video-toggle" type="button">Pokreni prizor</button>
      <button id="sound-toggle" type="button" aria-pressed="false">Uključi zvuk</button>
    </div>
  </div>
  <script type="module" src="./spatial-v2.js?v=4"></script>

</html>
